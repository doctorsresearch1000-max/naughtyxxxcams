# Configuración Cloudflare Workers (OpenNext).
# Secretos: NO los pongas aquí — usa `wrangler secret put` (ver abajo).

name = "naughtyxxxcams"
main = ".open-next/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "c7a39ac66ad54a34b760cc323472ddf2"

# Variables públicas (no sensibles). Token y API key → secretos de Workers.
[vars]
CRACKREVENUE_USER_AGENT = "NaughtyXxxCams/1.0 (+https://naughtyxxxcams.com)"
