name: Notion KPI sync

on:
  schedule:
    # Diario a las 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  notion-kpi-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enrich and sync KPIs to Notion
        run: npm run notion:sync-kpis
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          # Secret NOTION_DATABASE_ID → base principal CAM SITE NETWORK OS
          NOTION_MAIN_DB_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_HISTORY_DB_ID: ${{ secrets.NOTION_HISTORY_DB_ID }}
          CRAKREVENUE_API_KEY: ${{ secrets.CRAKREVENUE_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
