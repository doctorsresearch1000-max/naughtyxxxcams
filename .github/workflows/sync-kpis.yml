name: Sync Notion KPI History

on:
  schedule:
    # Diario a las 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync-kpis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync KPI snapshot to Notion
        run: node scripts/sync-kpis.js
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_MAIN_DB_ID: ${{ secrets.NOTION_MAIN_DB_ID }}
          NOTION_HISTORY_DB_ID: ${{ secrets.NOTION_HISTORY_DB_ID }}
